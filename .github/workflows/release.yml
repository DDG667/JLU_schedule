name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (optional; defaults to ref name)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and stage artifact
        id: artifact
        run: |
          APK_IN="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_IN" ]; then
            echo "Release APK not found: $APK_IN" >&2
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_IN"
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="${TAG_NAME#v}"
          fi
          mkdir -p dist
          OUT_NAME="JLU.Schedule_${VERSION_NAME}.apk"
          cp "$APK_IN" "dist/$OUT_NAME"
          sha256sum "dist/$OUT_NAME"
          ls -lh "dist/$OUT_NAME"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "file=dist/$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.artifact.outputs.tag }}"
          VERSION_NAME="${{ steps.artifact.outputs.version }}"
          APK_FILE="${{ steps.artifact.outputs.file }}"
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_FILE" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG_NAME" "$APK_FILE" \
              --repo "${{ github.repository }}" \
              --title "JLU Schedule v${VERSION_NAME}" \
              --notes $'## 东京夜（Tokyo Night）主题版\n\n- 跟进上游最新修复与 Liquid Glass 界面改版（v2.2.4）\n- 默认启用「东京夜 + 深色模式」，完整保留桌面小组件与启动图标配色\n- 应用内「检查更新」已切换为检测 `DDG667/JLU_schedule` GitHub Releases\n- 使用固定独立签名密钥构建：若从此前调试版或原版切换，请先在应用内「备份全部课表」并卸载旧包后再安装；后续新版均可直接应用内覆盖升级'
          fi
