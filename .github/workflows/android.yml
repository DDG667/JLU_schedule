name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, build, and inspect Android
        run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
